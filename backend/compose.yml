services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xw_recruitment
      POSTGRES_USER: xw
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - xw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xw -d xw_recruitment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xw_postgres_data:
