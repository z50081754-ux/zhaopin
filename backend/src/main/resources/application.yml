server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/xw-recruitment;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

xw:
  admin:
    account: ${ADMIN_ACCOUNT:admin}
    password: ${ADMIN_PASSWORD:123456}
  storage:
    directory: ${RESUME_STORAGE_DIR:./data/resumes}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.1.105:3000}
    admin-origins: ${ADMIN_FRONTEND_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}
  research:
    enabled: ${RESEARCH_ENABLED:false}
    wallet-encryption-key: ${RESEARCH_WALLET_ENCRYPTION_KEY:}
    wallet-hash-key: ${RESEARCH_WALLET_HASH_KEY:}
    privacy-hash-key: ${RESEARCH_PRIVACY_HASH_KEY:}
    rate-limit-per-minute: ${RESEARCH_RATE_LIMIT_PER_MINUTE:5}
    rate-limit-max-clients: ${RESEARCH_RATE_LIMIT_MAX_CLIENTS:10000}
    trusted-proxies: ${RESEARCH_TRUSTED_PROXIES:}
